version: 2
updates:
  # Root – Workspace-level dependencies & Catalog
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Framework versions (catalog entries)
      frameworks:
        patterns:
          - "nuxt"
          - "astro"
          - "@sveltejs/kit"
          - "@sveltejs/adapter-cloudflare"
          - "@sveltejs/vite-plugin-svelte"
          - "@tanstack/react-start"
          - "@tanstack/react-router"
          - "@tanstack/react-router-devtools"
          - "@tanstack/react-router-ssr-query"
          - "@tanstack/router-plugin"
          - "svelte"
          - "svelte-check"
          - "vue"
          - "vue-router"
          - "@astrojs/check"
          - "@astrojs/tailwind"

      # Vite ecosystem (catalog)
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "vite-tsconfig-paths"
          - "vite-plugin-devtools-json"
          - "vite-svg-loader"

      # React ecosystem
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"
          - "lucide-react"

      # Vue ecosystem
      vue-ecosystem:
        patterns:
          - "@vueuse/*"
          - "@lucide/vue"
          - "reka-ui"

      # Nuxt modules
      nuxt-modules:
        patterns:
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "dayjs-nuxt"
          - "shadcn-nuxt"

      # Development tools (catalog)
      devtools:
        patterns:
          - "typescript"
          - "eslint"
          - "@antfu/eslint-config"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@eslint/*"
          - "globals"

      # TailwindCSS (catalog)
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"

      # Utilities (catalog)
      utilities:
        patterns:
          - "clsx"
          - "tailwind-merge"
          - "class-variance-authority"

      # Testing
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "@vue/test-utils"
          - "@playwright/test"
          - "playwright-core"
          - "happy-dom"
          - "jsdom"
          - "web-vitals"

      # Hono backend
      hono:
        patterns:
          - "hono"
          - "@hono/*"
          - "hono-pino"
          - "pino"
          - "pino-pretty"
          - "sharp"
          - "colorthief"
          - "zod"
          - "lodash-es"
          - "@types/lodash-es"

      # Server & deployment
      server:
        patterns:
          - "nitro"
          - "wrangler"

      # Root workspace tools
      root-tooling:
        patterns:
          - "husky"
          - "lint-staged"
          - "esbuild"
          - "@types/node"
